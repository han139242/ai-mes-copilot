<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="智能调光台灯 MES 制造执行与质量追溯平台" />
    <title>智能调光台灯 MES</title>
    <style>
      html,
      body,
      #app {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Vue应用的挂载容器。main.js中的app.mount('#app')会找到并接管这个元素。 -->
    <div id="app"></div>
    <!-- type="module"表示使用ES模块；main.js是前端程序的启动入口。 -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
